[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skinder"
version = "0.1.0"
description = "Find agent skills that fit your task and working style."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
    "httpx>=0.28,<1", "fastembed>=0.7,<1", "usearch>=2.16,<3", "numpy>=2,<3",
]

[project.scripts]
skinder = "skinder.__main__:main"
best-effort-full-sync = "skinder.sync:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
